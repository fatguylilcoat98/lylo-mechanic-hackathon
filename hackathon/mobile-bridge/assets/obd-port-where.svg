<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="Original LYLO drawing: the OBD port is under the dashboard on the driver's side, below the steering wheel">
  <rect x="10" y="10" width="300" height="44" rx="10" fill="#3a4656"/><text x="160" y="38" fill="#b8c4d0" font-size="13" font-family="sans-serif" text-anchor="middle">DASHBOARD</text>
  <circle cx="110" cy="92" r="44" fill="none" stroke="#5b6b7f" stroke-width="10"/><circle cx="110" cy="92" r="12" fill="#5b6b7f"/>
  <rect x="102" y="136" width="16" height="24" fill="#5b6b7f"/>
  <path d="M60 172 H160 L150 204 H70 Z" fill="#0a0c0f" stroke="#f5c518" stroke-width="3"/>
  <g fill="#f5c518"><!-- 16 pins, 2 rows of 8 -->
    <rect x="70" y="178" width="6" height="6"/><rect x="81" y="178" width="6" height="6"/><rect x="92" y="178" width="6" height="6"/><rect x="103" y="178" width="6" height="6"/><rect x="114" y="178" width="6" height="6"/><rect x="125" y="178" width="6" height="6"/><rect x="136" y="178" width="6" height="6"/><rect x="147" y="178" width="6" height="6"/>
    <rect x="74" y="192" width="6" height="6"/><rect x="84" y="192" width="6" height="6"/><rect x="94" y="192" width="6" height="6"/><rect x="104" y="192" width="6" height="6"/><rect x="114" y="192" width="6" height="6"/><rect x="124" y="192" width="6" height="6"/><rect x="134" y="192" width="6" height="6"/><rect x="144" y="192" width="6" height="6"/>
  </g>
  <text x="170" y="192" fill="#f5c518" font-size="13" font-family="sans-serif">&#8592; 16-pin plug</text>
  <text x="160" y="240" fill="#f5c518" font-size="14" font-family="sans-serif" text-anchor="middle">Driver's side, below the wheel, near your knees</text>
</svg>
